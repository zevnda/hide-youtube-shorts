name: Build and release extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for this release'
        required: true

run-name: Build release v${{ github.event.inputs.version }}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # CHANGELOG.md becomes the release notes, so don't release without any
      - name: Check changelog
        run: |
          if ! grep -q '[^[:space:]]' CHANGELOG.md; then
            echo "::error::CHANGELOG.md is empty, add this release's changes first"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract current version
        id: extract-version
        run: |
          CURRENT_VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Update versions
        id: update-versions
        run: |
          sed -i "s/${{ steps.extract-version.outputs.current_version }}/${{ github.event.inputs.version }}/g" manifest.chrome.json
          sed -i "s/${{ steps.extract-version.outputs.current_version }}/${{ github.event.inputs.version }}/g" manifest.firefox.json
          sed -i "s/${{ steps.extract-version.outputs.current_version }}/${{ github.event.inputs.version }}/g" gradle.properties

      - name: Build directories
        run: ./gradlew build

      - name: Create Chrome ZIP
        run: |
          cd dist/chrome
          zip -r ../../hide-youtube-shorts-chrome-${{ github.event.inputs.version }}.zip *
          cd ../..

      - name: Create Firefox ZIP
        run: |
          cd dist/firefox
          zip -r ../../hide-youtube-shorts-firefox-${{ github.event.inputs.version }}.zip *
          cd ../..

      - name: Commit changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.chrome.json manifest.firefox.json gradle.properties
          git commit -m "Update version to ${{ github.event.inputs.version }}"
          git push

      - name: Create release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Hide YouTube Shorts v${{ github.event.inputs.version }}
          body_path: ./CHANGELOG.md
          files: |
            hide-youtube-shorts-chrome-${{ github.event.inputs.version }}.zip
            hide-youtube-shorts-firefox-${{ github.event.inputs.version }}.zip

      # Move this release's notes to the top of CHANGELOG-ARCHIVE.md and start the next one empty
      - name: Archive and clear changelog
        run: |
          VERSION=${{ github.event.inputs.version }}
          DATE=$(TZ=Australia/Sydney date '+%-d %B %Y')
          {
            printf '## v%s (%s)\n\n' "$VERSION" "$DATE"
            cat CHANGELOG.md
            if [ -s CHANGELOG-ARCHIVE.md ]; then
              printf '\n'
              cat CHANGELOG-ARCHIVE.md
            fi
          } > CHANGELOG-ARCHIVE.md.new
          mv CHANGELOG-ARCHIVE.md.new CHANGELOG-ARCHIVE.md
          : > CHANGELOG.md
          git add CHANGELOG.md CHANGELOG-ARCHIVE.md
          git commit -m "Archive changelog for $VERSION"
          git push
